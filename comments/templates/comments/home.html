<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment Wall</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    .comment { border-bottom: 1px solid #ddd; padding: 12px 0; }
    .meta { color: #777; font-size: 0.85em; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>Comment Wall</h1>

  <form method="post">
    {% csrf_token %}
    <input name="name" placeholder="Your name" maxlength="50" required>
    <textarea name="text" placeholder="Write a comment..." maxlength="500" required></textarea>
    <button type="submit">Post</button>
  </form>

  <h2>Comments ({{ comments|length }})</h2>

  {% for comment in comments %}
    <div class="comment">
      <strong>{{ comment.name }}</strong>
      <span class="meta">{{ comment.created_at|date:"M j, Y, g:i a" }}</span>
      <p>{{ comment.text|linebreaksbr }}</p>
    </div>
  {% empty %}
    <p>No comments yet. Be the first!</p>
  {% endfor %}
</body>
</html>
