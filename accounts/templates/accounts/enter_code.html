<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter code</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 0 16px; }
    input { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; font-size: 1.4em; letter-spacing: 6px; }
    button { padding: 8px 16px; cursor: pointer; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Check your email</h1>
  <p>We sent a code to <strong>{{ email }}</strong>.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input name="code" inputmode="numeric" maxlength="6" placeholder="000000" required autofocus>
    <button type="submit">Verify</button>
  </form>
  <p><a href="/login/">Use a different email or get a new code</a></p>
</body>
</html>
